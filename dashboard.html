<!doctype html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPN Dashboard | โรงพยาบาลศรีนครินทร์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Sarabun', 'Inter', sans-serif; }
    .gradient-header { background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%); }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 min-h-full">

  <header class="gradient-header text-white py-4 px-6 sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-2xl">📊</div>
        <div>
          <h1 class="text-xl font-bold">TPN Order Dashboard</h1>
          <p class="text-blue-100 text-xs">ระบบติดตามรายการสารอาหารทางหลอดเลือดดำ</p>
        </div>
      </div>
     <a href="index.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg transition-all text-sm font-medium backdrop-blur-sm border border-white/20">
  🏠 กลับหน้าคำนวณ
</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-8">
    <div class="bg-white rounded-3xl shadow-sm p-6 mb-8 border border-gray-100 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="flex flex-col">
          <span class="text-xs font-bold text-gray-400 mb-1 uppercase">กรองตามวันที่</span>
          <input type="date" id="filterDate" class="px-4 py-2 rounded-xl border-2 border-blue-50 focus:border-blue-500 outline-none text-gray-700 font-bold" onchange="renderCards()">
        </div>
        <button onclick="fetchOrders()" class="mt-5 px-6 py-2 bg-blue-50 text-blue-600 rounded-xl font-bold hover:bg-blue-100 transition-all flex items-center gap-2">
          <span>🔄</span> รีเฟรชข้อมูล
        </button>
      </div>
      <div id="statBox" class="text-right">
        <span class="text-xs font-bold text-gray-400 block uppercase">จำนวนเคสวันนี้</span>
        <span id="caseCount" class="text-3xl font-black text-blue-900">0</span>
      </div>
    </div>

    <div id="cardContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in">
      </div>
  </main>

  <script>
    // --- ตั้งค่า API URL ล่าสุดที่คุณขิมใช้ ---
    const API_URL = 'https://script.google.com/macros/s/AKfycby5VHSu21HRdyIYzJvrloomNF_zw1LmZA97aDgyfMGrTPMuzwZGdhPdUz0ucNS3RX8D7g/exec';
    let allOrders = [];

    // ดึงข้อมูลเมื่อโหลดหน้า
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('filterDate').valueAsDate = new Date();
      fetchOrders();
    });

    async function fetchOrders() {
      const container = document.getElementById('cardContainer');
      container.innerHTML = `
        <div class="col-span-full text-center py-20">
          <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent mb-4"></div>
          <p class="text-gray-500 font-medium">กำลังดึงข้อมูลล่าสุดจากระบบ...</p>
        </div>`;
      
      try {
        const response = await fetch(`${API_URL}?action=getData&ts=${new Date().getTime()}`);
        allOrders = await response.json();
        renderCards();
      } catch (e) {
        container.innerHTML = `<p class="col-span-full text-center py-20 text-red-500 font-bold">❌ ไม่สามารถเชื่อมต่อข้อมูลได้ กรุณาตรวจสอบการตั้งค่า API</p>`;
      }
    }

   function renderCards() {
      const container = document.getElementById('cardContainer');
      const filterDateInput = document.getElementById('filterDate').value; // YYYY-MM-DD
      const countEl = document.getElementById('caseCount');
      
      console.log("Raw Data from Sheet:", allOrders); // ตรวจสอบข้อมูลใน Console (F12)

      // 1. กรองข้อมูล
      const filtered = allOrders.filter(o => {
        // ถ้าไม่ได้เลือกวันที่ใน Filter ให้แสดงทั้งหมด
        if (!filterDateInput) return true; 

        try {
          // พยายามแปลงวันที่จาก Order Date ใน Sheet
          const d = new Date(o.order_date);
          if (isNaN(d.getTime())) return false;

          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          const orderDateFormatted = `${y}-${m}-${day}`;

          return orderDateFormatted === filterDateInput;
        } catch (err) {
          return false;
        }
      });

      countEl.textContent = filtered.length;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-20 bg-gray-100 rounded-3xl border-2 border-dashed border-gray-200">
            <p class="text-gray-400 font-bold">📭 ไม่พบรายการ Order ในวันที่เลือก</p>
            <button onclick="document.getElementById('filterDate').value=''; renderCards();" class="mt-4 text-blue-600 underline">แสดงรายการทั้งหมด</button>
          </div>`;
        return;
      }

      // 2. เรียงลำดับจากล่าสุดขึ้นก่อน และสร้าง Card
      // ใช้ [...filtered] เพื่อไม่ให้กระทบ Array เดิม
      // เรียงลำดับข้อมูลใหม่ล่าสุดขึ้นก่อน และสร้าง Card แนวนอน
  container.innerHTML = [...filtered].reverse().map(order => {
    // กำหนดสีตาม Route
    const isCentral = order.route?.toLowerCase() === 'central';
    const routeTagClass = isCentral ? 'bg-red-600 text-white' : 'bg-green-600 text-white';
    
    return `
    <div class="bg-white border-2 border-gray-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition-all relative group overflow-hidden animate-fade-in mb-2">
      
      <div class="flex flex-col md:flex-row items-center gap-6">
        
        <div class="flex flex-col items-center justify-center min-w-[120px] border-r-2 border-gray-100 pr-4">
          <span class="text-3xl font-black text-blue-900 leading-none mb-2">${order.ward || '-'}</span>
          <span class="px-3 py-1 rounded-full text-[12px] font-black ${routeTagClass} uppercase tracking-tighter text-center w-full">
            ${order.route || 'N/A'}
          </span>
        </div>

        <div class="flex-1">
          <h3 class="font-black text-2xl text-black mb-1 leading-tight">${order.patient_name || 'ไม่ระบุชื่อ'}</h3>
          <div class="flex gap-4">
             <span class="text-md font-bold text-black font-mono">HN: ${order.hn}</span>
             <span class="text-md font-bold text-black border-l-2 border-gray-300 pl-4">BW: ${order.bw || '0'} kg</span>
          </div>
        </div>

        <div class="flex gap-4 min-w-[300px]">
          <div class="flex-1 bg-blue-50 p-3 rounded-xl border border-blue-100 text-center">
            <span class="text-[11px] text-black block mb-1 font-black uppercase">Total Kcal</span>
            <div class="flex items-baseline justify-center gap-1">
              <span class="text-2xl font-black text-blue-800">${order.total_calories || '0'}</span>
              <span class="text-xs font-bold text-blue-800">kcal</span>
            </div>
          </div>
          
          <div class="flex-1 bg-purple-50 p-3 rounded-xl border border-purple-100 text-center">
            <span class="text-[11px] text-black block mb-1 font-black uppercase">Osmol</span>
            <div class="flex items-baseline justify-center gap-1">
              <span class="text-2xl font-black text-purple-800">${order.osmolarity || '0'}</span>
              <span class="text-xs font-bold text-purple-800">mOsm</span>
            </div>
          </div>
        </div>

        <div class="min-w-[100px] text-center border-l-2 border-gray-100 pl-4">
           <span class="text-[11px] text-black block font-black uppercase">PN Volume</span>
           <span class="text-xl font-black text-black">${order.pn_volume || '0'}</span>
           <span class="text-[11px] font-bold text-black">ml</span>
        </div>

        <div class="ml-2">
          <button onclick="deleteOrder(${order.row_index})" class="p-3 bg-red-50 text-red-600 rounded-xl hover:bg-red-600 hover:text-white transition-colors border border-red-100">
            🗑️ <span class="text-xs font-black">Off TPN</span>
          </button>
        </div>

      </div>
    </div>
    `;
  }).join('');

    async function deleteOrder(rowIndex) {
      if (!confirm("⚠️ ยืนยันการสั่ง Off TPN และลบข้อมูลเคสนี้?")) return;
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors', // ตามที่คุณขิมตั้งค่าไว้
          body: new URLSearchParams({ action: 'deleteRow', row_index: rowIndex })
        });
        alert("✅ สั่ง Off TPN เรียบร้อยแล้ว");
        await fetchOrders(); // โหลดข้อมูลใหม่ทันที
      } catch (e) {
        alert("❌ เกิดข้อผิดพลาดในการลบข้อมูล");
      }
    }
  </script>
</body>
</html>
