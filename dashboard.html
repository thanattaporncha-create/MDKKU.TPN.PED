<!doctype html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPN Dashboard | โรงพยาบาลศรีนครินทร์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Sarabun', 'Inter', sans-serif; }
    .gradient-header { background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%); }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 min-h-full">

  <header class="gradient-header text-white py-4 px-6 sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-2xl">📊</div>
        <div>
          <h1 class="text-xl font-bold">TPN Order Dashboard</h1>
          <p class="text-blue-100 text-xs">ระบบติดตามรายการสารอาหารทางหลอดเลือดดำ</p>
        </div>
      </div>
     <a href="index.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg transition-all text-sm font-medium backdrop-blur-sm border border-white/20">
  🏠 กลับหน้าคำนวณ
</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-8">
    <div class="bg-white rounded-3xl shadow-sm p-6 mb-8 border border-gray-100 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="flex flex-col">
          <span class="text-xs font-bold text-gray-400 mb-1 uppercase">กรองตามวันที่</span>
          <input type="date" id="filterDate" class="px-4 py-2 rounded-xl border-2 border-blue-50 focus:border-blue-500 outline-none text-gray-700 font-bold" onchange="renderCards()">
        </div>
        <button onclick="fetchOrders()" class="mt-5 px-6 py-2 bg-blue-50 text-blue-600 rounded-xl font-bold hover:bg-blue-100 transition-all flex items-center gap-2">
          <span>🔄</span> รีเฟรชข้อมูล
        </button>
      </div>
      <div id="statBox" class="text-right">
        <span class="text-xs font-bold text-gray-400 block uppercase">จำนวนเคสวันนี้</span>
        <span id="caseCount" class="text-3xl font-black text-blue-900">0</span>
      </div>
    </div>

    <div id="cardContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in">
      </div>
  </main>

  <script>
    // --- ตั้งค่า API URL ล่าสุดที่คุณขิมใช้ ---
    const API_URL = 'https://script.google.com/macros/s/AKfycbyl01v2uUFfnJ10MjYlXz286TUB2ez3g8s3M0GLHQachsfsv3sGu6dl43p6sxUVksmF/exec';
    let allOrders = [];

    // ดึงข้อมูลเมื่อโหลดหน้า
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('filterDate').valueAsDate = new Date();
      fetchOrders();
    });

    async function fetchOrders() {
      const container = document.getElementById('cardContainer');
      container.innerHTML = `
        <div class="col-span-full text-center py-20">
          <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent mb-4"></div>
          <p class="text-gray-500 font-medium">กำลังดึงข้อมูลล่าสุดจากระบบ...</p>
        </div>`;
      
      try {
        const response = await fetch(`${API_URL}?action=getData&ts=${new Date().getTime()}`);
        allOrders = await response.json();
        renderCards();
      } catch (e) {
        container.innerHTML = `<p class="col-span-full text-center py-20 text-red-500 font-bold">❌ ไม่สามารถเชื่อมต่อข้อมูลได้ กรุณาตรวจสอบการตั้งค่า API</p>`;
      }
    }

    function renderCards() {
      const container = document.getElementById('cardContainer');
      const filterDate = document.getElementById('filterDate').value;
      const countEl = document.getElementById('caseCount');
      
      // กรองข้อมูล (ถ้าไม่เลือกวันที่ให้แสดงทั้งหมด)
      const filtered = filterDate 
        ? allOrders.filter(o => {
            // ปรับ format วันที่ให้ตรงกันเพื่อเปรียบเทียบ
            const orderDateStr = new Date(o.order_date).toISOString().split('T')[0];
            return orderDateStr === filterDate;
          })
        : allOrders;

      countEl.textContent = filtered.length;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-20 bg-gray-100 rounded-3xl border-2 border-dashed border-gray-200">
            <p class="text-gray-400 font-bold">📭 ไม่มีรายการ Order ในวันที่เลือก</p>
          </div>`;
        return;
      }

      // เรียงจากล่าสุดขึ้นก่อน
      container.innerHTML = filtered.reverse().map(order => {
        const routeColor = order.route?.toLowerCase() === 'central' ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600';
        
        return `
        <div class="bg-white border border-gray-100 rounded-3xl p-6 shadow-sm hover:shadow-xl transition-all relative group overflow-hidden">
          <button onclick="deleteOrder(${order.row_index})" class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity bg-red-50 text-red-500 px-3 py-1 rounded-lg hover:bg-red-500 hover:text-white text-xs font-bold">
            🗑️ Off TPN
          </button>

          <div class="flex justify-between items-start mb-4">
            <span class="text-[10px] font-black text-blue-500 uppercase tracking-widest">${order.ward || 'General'}</span>
            <span class="px-3 py-1 rounded-full text-[10px] font-black ${routeColor} uppercase">${order.route || 'N/A'}</span>
          </div>

          <h3 class="font-black text-2xl text-gray-800 mb-1">${order.patient_name || 'ไม่ระบุชื่อ'}</h3>
          <p class="text-sm text-gray-400 mb-6 font-mono font-bold tracking-tighter">HN: ${order.hn}</p>
          
          <div class="grid grid-cols-2 gap-4 border-t border-gray-50 pt-5">
            <div class="bg-blue-50/50 p-3 rounded-2xl">
              <span class="text-[10px] text-gray-400 block mb-1 font-bold uppercase">Total Kcal</span>
              <span class="text-lg font-black text-blue-700">${order.total_calories || '0'}</span>
              <span class="text-[10px] text-blue-400 font-bold">kcal</span>
            </div>
            <div class="bg-purple-50/50 p-3 rounded-2xl">
              <span class="text-[10px] text-gray-400 block mb-1 font-bold uppercase">Osmol</span>
              <span class="text-lg font-black text-purple-700">${order.osmolarity || '0'}</span>
              <span class="text-[10px] text-purple-400 font-bold">mOsm</span>
            </div>
          </div>

          <div class="mt-4 flex justify-between items-center text-[10px] text-gray-300 font-bold">
             <span>BW: ${order.bw} kg</span>
             <span>PN: ${order.pn_volume} ml</span>
          </div>
        </div>
      `}).join('');
    }

    async function deleteOrder(rowIndex) {
      if (!confirm("⚠️ ยืนยันการสั่ง Off TPN และลบข้อมูลเคสนี้?")) return;
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors', // ตามที่คุณขิมตั้งค่าไว้
          body: new URLSearchParams({ action: 'deleteRow', row_index: rowIndex })
        });
        alert("✅ สั่ง Off TPN เรียบร้อยแล้ว");
        await fetchOrders(); // โหลดข้อมูลใหม่ทันที
      } catch (e) {
        alert("❌ เกิดข้อผิดพลาดในการลบข้อมูล");
      }
    }
  </script>
</body>
</html>
