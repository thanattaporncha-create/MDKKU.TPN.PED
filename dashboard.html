<!doctype html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPN Dashboard | โรงพยาบาลศรีนครินทร์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Sarabun', 'Inter', sans-serif; }
    .gradient-header { background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%); }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 min-h-full">

  <header class="gradient-header text-white py-3 px-6 sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-2xl">📊</div>
        <div>
          <h1 class="text-lg font-bold">TPN Order Dashboard</h1>
          <p class="text-blue-100 text-[10px]">ระบบติดตามรายการสารอาหารทางหลอดเลือดดำ</p>
        </div>
      </div>
      <a href="index.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg transition-all text-sm font-bold backdrop-blur-sm border border-white/20">
        🏠 กลับหน้าคำนวณ
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6">
    <div class="bg-white rounded-2xl shadow-sm p-4 mb-4 border border-gray-200 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="flex flex-col">
          <span class="text-[10px] font-black text-black mb-1 uppercase">กรองตามวันที่</span>
          <input type="date" id="filterDate" class="px-3 py-1.5 rounded-xl border-2 border-gray-100 focus:border-blue-500 outline-none text-black font-black text-sm" onchange="renderCards()">
        </div>
        <button onclick="fetchOrders()" class="mt-4 px-5 py-2 bg-blue-600 text-white rounded-xl font-black hover:bg-blue-700 transition-all flex items-center gap-2 text-sm shadow-md">
          <span>🔄</span> รีเฟรชข้อมูล
        </button>
      </div>
      <div class="text-right">
        <span class="text-[10px] font-black text-black block uppercase">จำนวนเคสวันนี้</span>
        <span id="caseCount" class="text-3xl font-black text-blue-900">0</span>
      </div>
    </div>

    <div id="cardContainer" class="flex flex-col gap-2 animate-fade-in">
      </div>
  </main>

  <script>
    // --- ตั้งค่า API URL ---
    const API_URL = 'https://script.google.com/macros/s/AKfycby5VHSu21HRdyIYzJvrloomNF_zw1LmZA97aDgyfMGrTPMuzwZGdhPdUz0ucNS3RX8D7g/exec';
    let allOrders = [];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('filterDate').valueAsDate = new Date();
      fetchOrders();
    });

    async function fetchOrders() {
      const container = document.getElementById('cardContainer');
      container.innerHTML = `
        <div class="text-center py-20">
          <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent mb-4"></div>
          <p class="text-black font-bold">กำลังดึงข้อมูลล่าสุดจาก Google Sheets...</p>
        </div>`;
      
      try {
        const response = await fetch(`${API_URL}?action=getData&ts=${new Date().getTime()}`);
        allOrders = await response.json();
        renderCards();
      } catch (e) {
        container.innerHTML = `<p class="text-center py-20 text-red-600 font-black">❌ ไม่สามารถโหลดข้อมูลได้</p>`;
      }
    }

    function renderCards() {
      const container = document.getElementById('cardContainer');
      const filterDateInput = document.getElementById('filterDate').value;
      const countEl = document.getElementById('caseCount');
      
      // 1. กรองข้อมูลตามวันที่
      const filtered = allOrders.filter(o => {
        if (!filterDateInput) return true;
        try {
          const d = new Date(o.order_date);
          if (isNaN(d.getTime())) return false;
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${day}` === filterDateInput;
        } catch (err) { return false; }
      });

      countEl.textContent = filtered.length;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 bg-white rounded-2xl border-2 border-dashed border-gray-200">
            <p class="text-black font-black text-lg">📭 ไม่มีรายการ Order ในวันที่เลือก</p>
            <button onclick="document.getElementById('filterDate').value=''; renderCards();" class="mt-4 text-blue-600 font-bold underline">แสดงรายการทั้งหมด</button>
          </div>`;
        return;
      }

      // 2. สร้างการ์ดแนวนอนขนาดกะทัดรัด (Compact Horizontal Card)
      container.innerHTML = [...filtered].reverse().map(order => {
        const isCentral = order.route?.toLowerCase() === 'central';
        const routeColor = isCentral ? 'bg-red-600' : 'bg-green-600';
        
        return `
        <div class="bg-white border border-gray-300 rounded-xl p-3 shadow-sm hover:border-blue-500 transition-all flex items-center gap-4 mb-1">
          
          <div class="flex flex-col items-center justify-center min-w-[90px] border-r border-gray-200 pr-3">
            <span class="text-2xl font-black text-black leading-none">${order.ward || '-'}</span>
            <span class="${routeColor} text-white text-[10px] px-2 py-0.5 rounded-full font-bold mt-1 uppercase">
              ${order.route || 'N/A'}
            </span>
          </div>

          <div class="flex-1 min-w-[200px]">
            <h3 class="font-black text-lg text-black leading-tight">${order.patient_name || 'ไม่ระบุชื่อ'}</h3>
            <div class="flex gap-4 text-xs font-black text-black font-mono">
              <span>HN: ${order.hn}</span>
              <span class="text-blue-700 border-l border-gray-300 pl-4">BW: ${order.bw} kg</span>
            </div>
          </div>

          <div class="flex gap-3 min-w-[280px]">
            <div class="flex-1 bg-gray-50 p-2 rounded-lg border border-gray-200 text-center">
              <span class="text-[9px] text-black block font-black uppercase mb-0.5">Total Kcal</span>
              <span class="text-base font-black text-blue-900">${order.total_calories || '0'}</span>
            </div>
            <div class="flex-1 bg-gray-50 p-2 rounded-lg border border-gray-200 text-center">
              <span class="text-[9px] text-black block font-black uppercase mb-0.5">Osmolarity</span>
              <span class="text-base font-black text-purple-900">${order.osmolarity || '0'}</span>
            </div>
            <div class="flex-1 bg-gray-50 p-2 rounded-lg border border-gray-200 text-center">
              <span class="text-[9px] text-black block font-black uppercase mb-0.5">PN Volume</span>
              <span class="text-base font-black text-black">${order.pn_volume || '0'}</span>
            </div>
          </div>

          <div class="pl-2">
            <button onclick="deleteOrder(${order.row_index})" class="px-3 py-2 bg-red-50 text-red-700 rounded-lg hover:bg-red-600 hover:text-white transition-colors border border-red-200 text-[11px] font-black whitespace-nowrap">
              🗑️ Off TPN
            </button>
          </div>
          
        </div>
        `;
      }).join('');
    }

    async function deleteOrder(rowIndex) {
      if (!confirm("⚠️ ยืนยันการสั่ง Off TPN และลบข้อมูลเคสนี้?")) return;
      
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: new URLSearchParams({ action: 'deleteRow', row_index: rowIndex })
        });
        alert("✅ สั่ง Off TPN เรียบร้อยแล้ว");
        await fetchOrders(); 
      } catch (e) {
        alert("❌ เกิดข้อผิดพลาดในการลบข้อมูล");
      }
    }
  </script>
</body>
</html>
