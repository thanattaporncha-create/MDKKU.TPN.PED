<!doctype html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPN Dashboard | โรงพยาบาลศรีนครินทร์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Sarabun', 'Inter', sans-serif; }
    .gradient-header { background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%); }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    /* สไตล์สำหรับ Scrollbar ของ Dropdown */
    #wardFilterDropdown::-webkit-scrollbar { width: 6px; }
    #wardFilterDropdown::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="bg-gray-50 min-h-full">

  <header class="gradient-header text-white py-3 px-6 sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-2xl">📊</div>
        <div>
          <h1 class="text-lg font-bold uppercase tracking-tight">TPN Order Dashboard</h1>
          <p class="text-blue-100 text-[10px]">โรงพยาบาลศรีนครินทร์ (Srinagarind Hospital)</p>
        </div>
      </div>
      <div class="flex gap-2">
        <a href="index.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl transition-all text-sm font-black backdrop-blur-sm border border-white/20">
          🏠 คำนวณใหม่
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6">
    <div class="bg-white rounded-2xl shadow-sm p-5 mb-4 border border-gray-200">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
        
        <div class="flex flex-col">
          <span class="text-[11px] font-black text-black mb-1 uppercase tracking-tighter">🗓️ วันที่</span>
          <input type="date" id="filterDate" class="px-3 py-2 rounded-xl border-2 border-gray-100 focus:border-blue-500 outline-none text-black font-black text-sm" onchange="renderCards()">
        </div>

        <div class="flex flex-col relative">
          <span class="text-[11px] font-black text-black mb-1 uppercase tracking-tighter">🏥 หอผู้ป่วย (Ward)</span>
          <input type="text" id="filterWardInput" 
                 placeholder="พิมพ์ค้นหา Ward..." 
                 class="px-3 py-2 rounded-xl border-2 border-gray-100 focus:border-blue-500 outline-none text-black font-black text-sm"
                 onfocus="showWardDropdown()" 
                 oninput="filterWardOptions()"
                 autocomplete="off">
          <input type="hidden" id="filterWardValue">
          
          <div id="wardFilterDropdown" class="hidden absolute left-0 right-0 top-[100%] z-[100] mt-1 bg-white border border-gray-200 rounded-xl shadow-2xl max-h-56 overflow-y-auto">
            <div id="wardFilterOptions" class="py-1"></div>
          </div>
        </div>

        <div class="flex flex-col">
          <span class="text-[11px] font-black text-black mb-1 uppercase tracking-tighter">🔍 เลข HN</span>
          <input type="text" id="filterHN" placeholder="ระบุ HN..." class="px-3 py-2 rounded-xl border-2 border-gray-100 focus:border-blue-500 outline-none text-black font-black text-sm" oninput="renderCards()">
        </div>

        <div class="flex items-center justify-between gap-3">
          <button onclick="clearAllFilters()" class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-xl font-black hover:bg-gray-200 transition-all text-sm border border-gray-200">
            ล้างค่า
          </button>
          <button onclick="fetchOrders()" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-xl font-black hover:bg-blue-700 transition-all text-sm shadow-md">
            🔄 รีเฟรช
          </button>
          <div class="text-right min-w-[60px]">
            <span id="caseCount" class="text-3xl font-black text-blue-900 leading-none">0</span>
            <span class="text-[10px] font-black text-black block uppercase">Case</span>
          </div>
        </div>

      </div>
    </div>

    <div id="cardContainer" class="flex flex-col gap-2 animate-fade-in">
    </div>
  </main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycby5VHSu21HRdyIYzJvrloomNF_zw1LmZA97aDgyfMGrTPMuzwZGdhPdUz0ucNS3RX8D7g/exec';
    let allOrders = [];

    document.addEventListener('DOMContentLoaded', () => {
      // ไม่บังคับวันที่ตอนเริ่ม เพื่อให้เห็นข้อมูลทั้งหมด
      fetchOrders();
    });

    async function fetchOrders() {
      const container = document.getElementById('cardContainer');
      container.innerHTML = `<div class="text-center py-20"><div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent mb-4"></div><p class="text-black font-black">กำลังโหลดข้อมูลล่าสุด...</p></div>`;
      
      try {
        const response = await fetch(`${API_URL}?action=getData&ts=${new Date().getTime()}`);
        allOrders = await response.json();
        renderCards();
      } catch (e) {
        container.innerHTML = `<p class="text-center py-20 text-red-600 font-black">❌ ไม่สามารถเชื่อมต่อกับระบบได้</p>`;
      }
    }

    // --- ระบบพิมพ์ค้นหา Ward (Autocomplete) ---
    function showWardDropdown() {
      const dropdown = document.getElementById('wardFilterDropdown');
      dropdown.classList.remove('hidden');
      const wards = [...new Set(allOrders.map(o => o.ward).filter(w => w))].sort();
      renderWardFilterOptions(wards);
    }

    function filterWardOptions() {
      const searchTerm = document.getElementById('filterWardInput').value.toLowerCase();
      const wards = [...new Set(allOrders.map(o => o.ward).filter(w => w))].sort();
      const filtered = wards.filter(w => w.toLowerCase().includes(searchTerm));
      renderWardFilterOptions(filtered);
      if (searchTerm === "") {
        document.getElementById('filterWardValue').value = "";
        renderCards();
      }
    }

    function renderWardFilterOptions(list) {
      const container = document.getElementById('wardFilterOptions');
      if (list.length === 0) {
        container.innerHTML = '<div class="px-4 py-2 text-gray-400 text-xs font-bold">ไม่พบข้อมูล</div>';
        return;
      }
      container.innerHTML = `<div onclick="selectWardFilter('')" class="px-4 py-2 hover:bg-blue-50 cursor-pointer text-blue-600 text-sm font-black border-b border-gray-50">ทั้งหมด</div>` + 
        list.map(w => `<div onclick="selectWardFilter('${w}')" class="px-4 py-2 hover:bg-blue-50 cursor-pointer text-black text-sm font-black border-b border-gray-50 last:border-0">${w}</div>`).join('');
    }

    function selectWardFilter(val) {
      document.getElementById('filterWardInput').value = val || "";
      document.getElementById('filterWardValue').value = val;
      document.getElementById('wardFilterDropdown').classList.add('hidden');
      renderCards();
    }

    document.addEventListener('click', (e) => {
      const container = document.getElementById('filterWardInput').parentElement;
      if (!container.contains(e.target)) document.getElementById('wardFilterDropdown').classList.add('hidden');
    });

    function clearAllFilters() {
      document.getElementById('filterDate').value = "";
      document.getElementById('filterWardInput').value = "";
      document.getElementById('filterWardValue').value = "";
      document.getElementById('filterHN').value = "";
      renderCards();
    }

    // --- ฟังก์ชันหลักในการแสดงผลการ์ด ---
    function renderCards() {
      const container = document.getElementById('cardContainer');
      const countEl = document.getElementById('caseCount');
      
      const fDate = document.getElementById('filterDate').value;
      const fWard = document.getElementById('filterWardValue').value;
      const fHN = document.getElementById('filterHN').value.toLowerCase();

      const filtered = allOrders.filter(o => {
        let matchDate = true;
        if (fDate) {
          const d = new Date(o.order_date);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          matchDate = (`${y}-${m}-${day}` === fDate);
        }
        let matchWard = fWard ? (o.ward === fWard) : true;
        let matchHN = fHN ? (o.hn && o.hn.toString().toLowerCase().includes(fHN)) : true;
        return matchDate && matchWard && matchHN;
      });

      countEl.textContent = filtered.length;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-16 bg-white rounded-2xl border-2 border-dashed border-gray-200"><p class="text-black font-black text-lg">📭 ไม่พบรายการตามเงื่อนไขที่คุณเลือก</p></div>`;
        return;
      }

      container.innerHTML = [...filtered].reverse().map(order => {
        const isCentral = order.route?.toLowerCase() === 'central';
        const routeColor = isCentral ? 'bg-red-600' : 'bg-green-600';
        
        return `
        <div class="bg-white border border-gray-300 rounded-xl p-3 shadow-sm hover:border-blue-500 transition-all flex items-center gap-4 mb-1">
          <div class="flex flex-col items-center justify-center min-w-[90px] border-r border-gray-200 pr-3">
            <span class="text-2xl font-black text-black leading-none">${order.ward || '-'}</span>
            <span class="${routeColor} text-white text-[9px] px-2 py-0.5 rounded-full font-bold mt-1 uppercase tracking-tighter">${order.route || 'N/A'}</span>
          </div>

          <div class="flex-1 min-w-[200px]">
            <h3 class="font-black text-lg text-black leading-tight">${order.patient_name || 'ไม่ระบุชื่อ'}</h3>
            <div class="flex gap-4 text-xs font-black text-black font-mono">
              <span>HN: ${order.hn}</span>
              <span class="text-blue-700 border-l border-gray-300 pl-4">BW: ${order.bw} kg</span>
            </div>
          </div>

          <div class="flex gap-2 min-w-[300px]">
            <div class="flex-1 bg-gray-50 p-2 rounded-lg border border-gray-200 text-center">
              <span class="text-[9px] text-black block font-black uppercase mb-0.5">Total Kcal</span>
              <span class="text-base font-black text-blue-900">${order.total_calories || '0'}</span>
            </div>
            <div class="flex-1 bg-gray-50 p-2 rounded-lg border border-gray-200 text-center">
              <span class="text-[9px] text-black block font-black uppercase mb-0.5">Osmolarity</span>
              <span class="text-base font-black text-purple-900">${order.osmolarity || '0'}</span>
            </div>
            <div class="flex-1 bg-gray-50 p-2 rounded-lg border border-gray-200 text-center">
              <span class="text-[9px] text-black block font-black uppercase mb-0.5">PN Volume</span>
              <span class="text-base font-black text-black">${order.pn_volume || '0'}</span>
            </div>
          </div>

          <div class="pl-2">
            <button onclick="deleteOrder(${order.row_index})" class="px-3 py-2 bg-red-50 text-red-700 rounded-lg hover:bg-red-600 hover:text-white transition-colors border border-red-200 text-[11px] font-black whitespace-nowrap">🗑️ Off</button>
          </div>
        </div>`;
      }).join('');
    }

    async function deleteOrder(rowIndex) {
      if (!confirm("⚠️ ยืนยันการสั่ง Off TPN และลบข้อมูลเคสนี้?")) return;
      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: new URLSearchParams({ action: 'deleteRow', row_index: rowIndex })
        });
        alert("✅ สั่ง Off TPN เรียบร้อยแล้ว");
        await fetchOrders(); 
      } catch (e) {
        alert("❌ เกิดข้อผิดพลาด");
      }
    }
  </script>
</body>
</html>
